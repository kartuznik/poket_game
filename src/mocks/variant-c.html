<!DOCTYPE html>
<html lang="ru" data-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант В. Только текст</title>
  <style>
    :root {
      color-scheme: light;
      --bg-page: #f6f6f3;
      --bg-card: #ffffff;
      --bg-desk: #d8d8d2;
      --text: #16181d;
      --text-secondary: #434956;
      --cobalt: #1d4ed8;
      --border: #16181d;
      --shadow: 3px 3px 0 #16181d;
    }
    :root[data-color-scheme="dark"] {
      color-scheme: dark;
      --bg-page: #1b1d22;
      --bg-card: #222838;
      --bg-desk: #101114;
      --text: #f3f4f6;
      --text-secondary: #c8cdd6;
      --cobalt: #1d4ed8;
      --border: #8f96a4;
      --shadow: 3px 3px 0 #aeb4c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-desk);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .phone {
      width: 375px;
      margin: 24px auto;
      padding: 16px;
      background: var(--bg-page);
      color: var(--text);
    }
    .top {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 800;
      line-height: 1.3;
    }
    button {
      min-height: 44px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: transparent;
      box-shadow: 2px 2px 0 var(--border);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 700;
      line-height: 1.3;
    }
    ul {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    li {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: baseline;
    }
    .dot {
      color: var(--text-secondary);
      font-weight: 700;
    }
    .name { font-size: 0.875rem; font-weight: 700; }
    .score {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
      font-weight: 700;
    }
    .mark {
      color: var(--cobalt);
      font-size: 0.75rem;
      font-weight: 800;
    }
    .gap {
      margin: 10px 0 0;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .value {
      margin: 4px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .note {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top">
      <h1>Вариант В. Только текст</h1>
      <button type="button" data-theme>Светлая тема</button>
    </header>
    <article class="card">
      <section>
        <h2>Приоритет</h2>
        <ul>
          <li>
            <span class="dot"></span>
            <span class="name">Приём обращений</span>
            <span class="score">5</span>
            <span class="mark">лидер</span>
          </li>
          <li>
            <span class="dot">·</span>
            <span class="name">Ответы на вопросы</span>
            <span class="score">3</span>
            <span></span>
          </li>
          <li>
            <span class="dot">·</span>
            <span class="name">Запись и заказы</span>
            <span class="score">3</span>
            <span></span>
          </li>
          <li>
            <span class="dot">·</span>
            <span class="name">Оплата</span>
            <span class="score">2</span>
            <span></span>
          </li>
          <li>
            <span class="dot">·</span>
            <span class="name">Напоминания</span>
            <span class="score">2</span>
            <span></span>
          </li>
          <li>
            <span class="dot">·</span>
            <span class="name">Отчёты</span>
            <span class="score">1</span>
            <span></span>
          </li>
        </ul>
        <p class="gap">На 2 балла выше следующего</p>
      </section>
      <section>
        <h2>Чек-лист из 9</h2>
        <p class="value">6/9</p>
        <p class="note">Закройте пробелы</p>
      </section>
      <section>
        <h2>Под риском за месяц</h2>
        <p class="value">500&nbsp;000&nbsp;₽</p>
      </section>
    </article>
  </main>
  <script>
    const root = document.documentElement;
    const button = document.querySelector('[data-theme]');
    function paint() {
      const dark = root.dataset.colorScheme === 'dark';
      button.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
      button.setAttribute('aria-pressed', String(dark));
    }
    button.addEventListener('click', () => {
      root.dataset.colorScheme = root.dataset.colorScheme === 'dark' ? 'light' : 'dark';
      paint();
    });
    paint();
  </script>
</body>
</html>

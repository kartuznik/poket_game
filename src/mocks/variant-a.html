<!DOCTYPE html>
<html lang="ru" data-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант А. Полоски и кольцо</title>
  <style>
    :root {
      color-scheme: light;
      --bg-page: #f6f6f3;
      --bg-card: #ffffff;
      --bg-desk: #d8d8d2;
      --text: #16181d;
      --text-secondary: #434956;
      --cobalt: #1d4ed8;
      --bar-rest: #8f96a4;
      --border: #16181d;
      --shadow: 3px 3px 0 #16181d;
    }
    :root[data-color-scheme="dark"] {
      color-scheme: dark;
      --bg-page: #1b1d22;
      --bg-card: #222838;
      --bg-desk: #101114;
      --text: #f3f4f6;
      --text-secondary: #c8cdd6;
      --cobalt: #1d4ed8;
      --bar-rest: #8f96a4;
      --border: #8f96a4;
      --shadow: 3px 3px 0 #aeb4c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-desk);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .phone {
      width: 375px;
      margin: 24px auto;
      padding: 16px;
      background: var(--bg-page);
      color: var(--text);
    }
    .top {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 800;
      line-height: 1.3;
    }
    button {
      min-height: 44px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: transparent;
      box-shadow: 2px 2px 0 var(--border);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .bars { display: flex; flex-direction: column; gap: 10px; }
    .bar-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .name { font-size: 0.875rem; font-weight: 700; }
    .score {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
      font-weight: 700;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: var(--bar-rest);
    }
    .bar.leader { background: var(--cobalt); }
    .check {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .ring { display: block; }
    .ring-track { fill: none; stroke: var(--bar-rest); stroke-width: 4; }
    .ring-value { fill: none; stroke: var(--cobalt); stroke-width: 4; }
    .ring text {
      fill: currentColor;
      font-size: 12px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .verdict {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .money {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top">
      <h1>Вариант А. Полоски и кольцо</h1>
      <button type="button" data-theme>Светлая тема</button>
    </header>
    <article class="card">
      <section>
        <h2>Приоритет</h2>
        <div class="bars" style="margin-top: 10px">
          <div>
            <div class="bar-head"><span class="name">Приём обращений</span><span class="score">5</span></div>
            <div class="bar leader" style="width: 100%; margin-top: 4px"></div>
          </div>
          <div>
            <div class="bar-head"><span class="name">Ответы на вопросы</span><span class="score">3</span></div>
            <div class="bar" style="width: 60%; margin-top: 4px"></div>
          </div>
          <div>
            <div class="bar-head"><span class="name">Запись и заказы</span><span class="score">3</span></div>
            <div class="bar" style="width: 60%; margin-top: 4px"></div>
          </div>
          <div>
            <div class="bar-head"><span class="name">Оплата</span><span class="score">2</span></div>
            <div class="bar" style="width: 40%; margin-top: 4px"></div>
          </div>
          <div>
            <div class="bar-head"><span class="name">Напоминания</span><span class="score">2</span></div>
            <div class="bar" style="width: 40%; margin-top: 4px"></div>
          </div>
          <div>
            <div class="bar-head"><span class="name">Отчёты</span><span class="score">1</span></div>
            <div class="bar" style="width: 20%; margin-top: 4px"></div>
          </div>
        </div>
      </section>
      <section class="check">
        <h2>Чек-лист из 9</h2>
        <svg class="ring" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="6 из 9">
          <circle class="ring-track" cx="28" cy="28" r="26"></circle>
          <circle class="ring-value" cx="28" cy="28" r="26" stroke-dasharray="108.91 54.45" transform="rotate(-90 28 28)"></circle>
          <text x="28" y="32" text-anchor="middle">6/9</text>
        </svg>
        <p class="verdict">Закройте пробелы</p>
      </section>
      <section>
        <h2>Под риском за месяц</h2>
        <p class="money">500&nbsp;000&nbsp;₽</p>
      </section>
    </article>
  </main>
  <script>
    const root = document.documentElement;
    const button = document.querySelector('[data-theme]');
    function paint() {
      const dark = root.dataset.colorScheme === 'dark';
      button.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
      button.setAttribute('aria-pressed', String(dark));
    }
    button.addEventListener('click', () => {
      root.dataset.colorScheme = root.dataset.colorScheme === 'dark' ? 'light' : 'dark';
      paint();
    });
    paint();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" data-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант Б. Столбики и линия</title>
  <style>
    :root {
      color-scheme: light;
      --bg-page: #f6f6f3;
      --bg-card: #ffffff;
      --bg-desk: #d8d8d2;
      --text: #16181d;
      --text-secondary: #434956;
      --cobalt: #1d4ed8;
      --bar-rest: #8f96a4;
      --border: #16181d;
      --shadow: 3px 3px 0 #16181d;
    }
    :root[data-color-scheme="dark"] {
      color-scheme: dark;
      --bg-page: #1b1d22;
      --bg-card: #222838;
      --bg-desk: #101114;
      --text: #f3f4f6;
      --text-secondary: #c8cdd6;
      --cobalt: #1d4ed8;
      --bar-rest: #8f96a4;
      --border: #8f96a4;
      --shadow: 3px 3px 0 #aeb4c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-desk);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .phone {
      width: 375px;
      margin: 24px auto;
      padding: 16px;
      background: var(--bg-page);
      color: var(--text);
    }
    .top {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 800;
      line-height: 1.3;
    }
    button {
      min-height: 44px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: transparent;
      box-shadow: 2px 2px 0 var(--border);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 0.8125rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .cols {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 40px;
    }
    .col {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
      height: 100%;
    }
    .stick {
      width: 100%;
      max-width: 28px;
      border-radius: 4px 4px 0 0;
      background: var(--bar-rest);
    }
    .stick.leader { background: var(--cobalt); }
    .ticks {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }
    .ticks span {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.6875rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .meter {
      height: 8px;
      border-radius: 999px;
      background: var(--bar-rest);
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 66.666%;
      background: var(--cobalt);
    }
    .value {
      margin: 8px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .verdict {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top">
      <h1>Вариант Б. Столбики и линия</h1>
      <button type="button" data-theme>Светлая тема</button>
    </header>
    <article class="card">
      <section>
        <h2>Приоритет</h2>
        <div class="cols" aria-hidden="true">
          <div class="col"><div class="stick leader" style="height: 40px"></div></div>
          <div class="col"><div class="stick" style="height: 24px"></div></div>
          <div class="col"><div class="stick" style="height: 24px"></div></div>
          <div class="col"><div class="stick" style="height: 16px"></div></div>
          <div class="col"><div class="stick" style="height: 16px"></div></div>
          <div class="col"><div class="stick" style="height: 8px"></div></div>
        </div>
        <div class="ticks">
          <span>При</span>
          <span>Отв</span>
          <span>Зап</span>
          <span>Опл</span>
          <span>Нап</span>
          <span>Отч</span>
        </div>
      </section>
      <section>
        <h2>Чек-лист из 9</h2>
        <div class="meter" role="img" aria-label="6 из 9"><div class="meter-fill"></div></div>
        <p class="value">6/9</p>
        <p class="verdict">Закройте пробелы</p>
      </section>
      <section>
        <h2>Под риском за месяц</h2>
        <p class="value">500&nbsp;000&nbsp;₽</p>
      </section>
    </article>
  </main>
  <script>
    const root = document.documentElement;
    const button = document.querySelector('[data-theme]');
    function paint() {
      const dark = root.dataset.colorScheme === 'dark';
      button.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
      button.setAttribute('aria-pressed', String(dark));
    }
    button.addEventListener('click', () => {
      root.dataset.colorScheme = root.dataset.colorScheme === 'dark' ? 'light' : 'dark';
      paint();
    });
    paint();
  </script>
</body>
</html>
